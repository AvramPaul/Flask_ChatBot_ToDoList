{% extends 'base.html' %}

{% block head %}
<title>Edit Task | Task Smash</title>
{% endblock %}

{% block body %}
<div class="page-shell">
    <div class="app-card edit-card">
        <header class="topbar compact-header">
            <div>
                <p class="eyebrow">Update task</p>
                <h1>Edit your task</h1>
            </div>
        </header>

        <form action="{{ url_for('update', id=task_to_update.id) }}" method="POST" class="task-form">
            <div class="input-row stacked-row">
                <input type="text" name="content" id="content" value="{{ task_to_update.content }}" required>
                <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
        </form>

        <a href="{{ url_for('index') }}" class="back-link">← Back to tasks</a>
    </div>
</div>
{% endblock %}
